name: cine_book
description: Cin-Star - Ung dung dat ve rap chieu phim.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # HTTP Client & Caching
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_file_store: ^1.2.0

  # Real-time Communication
  web_socket_channel: ^2.4.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # Authentication
  google_sign_in: ^6.1.6

  # Routing & Deeplink
  go_router: ^14.2.0

  # Push Notifications
  firebase_messaging: ^16.4.0
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  flutter_local_notifications: ^17.2.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  webview_flutter: ^4.8.0

  # Device Information
  device_info_plus: ^10.1.0

  # Image Handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  http_parser: ^4.0.2

  # JSON Serialization
  json_annotation: ^4.8.1
  video_player: ^2.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # JSON Code Generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

  # Testing & Mocking
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

  # App Icon Generator
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# Cấu hình flutter_launcher_icons – chạy: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false
