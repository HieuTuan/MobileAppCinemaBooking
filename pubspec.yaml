name: cine_book
description: Cineverse Club - ung dung dat ve rap VIP voi AI concierge, admin va staff panel.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  
  # HTTP Client & Caching
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_file_store: ^1.2.0
  
  # Real-time Communication
  web_socket_channel: ^2.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Authentication
  google_sign_in: ^6.1.6
  
  # Routing & Deeplink
  go_router: ^14.2.0

  # Push Notifications
  firebase_messaging: ^14.7.9
  firebase_core: ^2.24.2
  flutter_local_notifications: ^17.2.4
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  webview_flutter: ^4.8.0
  
  # Image Handling
  cached_network_image: ^3.3.1
  
  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # JSON Code Generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  
  # Testing & Mocking
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
