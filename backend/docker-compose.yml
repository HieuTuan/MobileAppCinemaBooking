services:
  db:
    image: postgres:16-alpine
    container_name: my_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      # Bạn có thể tạo thêm database mặc định nếu muốn:
      POSTGRES_DB: cinema_booking_mobile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: