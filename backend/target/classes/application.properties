spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
server.port=${SERVER_PORT}

# OpenAPI / Swagger
# Requirements: 38.1, 47.3
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.enable-native-filter=false

# Auth / Google OAuth
auth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
auth.google.android-client-ids=${GOOGLE_ANDROID_CLIENT_IDS:}
auth.google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:}
auth.google.project-number=${GOOGLE_PROJECT_NUMBER:}

# Mail for forgot password. Fill SPRING_MAIL_* in .env to send real emails.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# Booking config
booking.hold-duration-minutes=10
booking.default-seat-price=120000
booking.vnpay-secret=${BOOKING_VNPAY_SECRET:cineluxe-demo-vnpay-secret-key-123456789}
booking.api-base-url=${BOOKING_API_BASE_URL:http://10.0.2.2:8080}

# Multipart upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=85MB

# Cloudinary config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=CineLuxePool


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
