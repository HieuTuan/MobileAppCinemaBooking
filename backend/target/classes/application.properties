spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
server.port=${SERVER_PORT}

# Jackson: serialize Instant/Date as ISO 8601 strings (not numeric timestamps)
# Required so Flutter DateTime.parse() can parse showtimeDateTime, createdAt, etc.
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI / Swagger

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.enable-native-filter=false

# Auth / Google OAuth
auth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
auth.google.android-client-ids=${GOOGLE_ANDROID_CLIENT_IDS:}
auth.google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:}
auth.google.project-number=${GOOGLE_PROJECT_NUMBER:}


spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SPRING_MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}

# Booking config
booking.hold-duration-minutes=3
booking.default-seat-price=120000
booking.vnpay-secret=${BOOKING_VNPAY_SECRET:cineluxe-demo-vnpay-secret-key-123456789}
booking.vnpay-pay-url=${BOOKING_VNPAY_PAY_URL:}
booking.vnpay-terminal-id=${BOOKING_VNPAY_TERMINAL_ID:}
booking.vnpay-return-url=${BOOKING_VNPAY_RETURN_URL:}
booking.vnpay-order-type=${BOOKING_VNPAY_ORDER_TYPE:other}
booking.vnpay-locale=${BOOKING_VNPAY_LOCALE:vn}
booking.api-base-url=${BOOKING_API_BASE_URL:http://192.168.1.18:8080}

# Multipart upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=85MB

# Cloudinary config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME_M:${CLOUDINARY_CLOUD_NAME:}}
cloudinary.api-key=${CLOUDINARY_API_KEY_M:${CLOUDINARY_API_KEY:}}
cloudinary.api-secret=${CLOUDINARY_API_SECRET_M:${CLOUDINARY_API_SECRET:}}


spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=CineLuxePool


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
